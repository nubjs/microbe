# Real-registry sweep, run on demand: build the default binary and install real packages
# with it on every OS, then run the bins it linked. Not part of CI, because it needs the
# network and the registry's current state.
name: Sweep
on:
  workflow_dispatch:
jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: [""]
        include:
          # The Linux in-binary TLS build, which nothing else exercises against the registry.
          - os: ubuntu-latest
            features: --features tls
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: cargo build --locked --release ${{ matrix.features }}
      - name: Install real packages and run their bins
        shell: bash
        run: |
          set -euo pipefail
          for f in target/release/microbe target/release/microbe.exe; do [ -f "$f" ] && M=$PWD/$f; done
          run_bin() { # <dir> <cmd> <args...>
            local dir=$1 cmd=$2; shift 2
            local bin="$dir/node_modules/.bin/$cmd"
            [ -f "$bin.cmd" ] && bin="$bin.cmd"
            "$bin" "$@"
          }
          echo "== spec installs"
          for pkg in eslint vite typescript esbuild; do
            d=$RUNNER_TEMP/spec-$pkg; "$M" install "$pkg" --dir "$d" | tail -3
          done
          run_bin "$RUNNER_TEMP/spec-eslint" eslint --version
          run_bin "$RUNNER_TEMP/spec-vite" vite --version
          run_bin "$RUNNER_TEMP/spec-typescript" tsc --version
          run_bin "$RUNNER_TEMP/spec-esbuild" esbuild --version
          echo "== package map through install-manifest, with an explicit .npmrc"
          d=$RUNNER_TEMP/map
          printf '{"name":"x","dependencies":{"express":"^5","@types/node":"22","is-odd":"^3"},"devDependencies":{"nope":"1"}}' > "$RUNNER_TEMP/package.json"
          printf 'registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n' > "$RUNNER_TEMP/bad.npmrc"
          if "$M" install-manifest "$RUNNER_TEMP/package.json" --dir "$d" --npmrc "$RUNNER_TEMP/bad.npmrc"; then echo "unexpanded \${VAR} was accepted"; exit 1; fi
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/ok.npmrc"
          "$M" install-manifest "$RUNNER_TEMP/package.json" --dir "$d" --npmrc "$RUNNER_TEMP/ok.npmrc" | head -5
          [ ! -e "$d/node_modules/nope" ]
          node -e "const e=require(require('path').join(process.argv[1],'node_modules','express')); console.log('express', typeof e)" "$d"
          node -e "console.log('is-odd', require(require('path').join(process.argv[1],'node_modules','is-odd'))(3))" "$d"
          test -f "$d/node_modules/@types/node/package.json"
          echo "== a second install over the first fetches nothing"
          "$M" install-manifest "$RUNNER_TEMP/package.json" --dir "$d" | grep -x '0 packages'
          echo "== stdin manifest, and the usage errors exit 2 before any network"
          "$M" install-manifest - --dir "$d" < "$RUNNER_TEMP/package.json" | grep -x '0 packages'
          echo "== --json prints the installation"
          "$M" install typescript@5 --dir "$RUNNER_TEMP/j" --json > "$RUNNER_TEMP/out.json"
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const keys = Object.keys(r).sort().join(",");
            if (keys !== "bins,packages,roots,skippedInstallScripts") throw new Error(keys);
            if (r.roots[0].name !== "typescript" || r.packages !== 1 || !("tsc" in r.bins)) throw new Error(JSON.stringify(r));
          ' "$RUNNER_TEMP/out.json"
          usage() { # <expected exit> <args...>
            local want=$1; shift
            set +e; "$M" "$@" >/dev/null 2>&1; local got=$?; set -e
            [ "$got" = "$want" ] || { echo "microbe $* exited $got, expected $want"; exit 1; }
          }
          usage 2 install --dir "$RUNNER_TEMP/u"
          usage 2 install is-odd
          usage 2 install-manifest --dir "$RUNNER_TEMP/u"
          usage 2 install-manifest a b --dir "$RUNNER_TEMP/u"
          usage 2 install --from "$RUNNER_TEMP/package.json" --dir "$RUNNER_TEMP/u"
          usage 2 frobnicate is-odd --dir "$RUNNER_TEMP/u"
          printf '{"name":"x"}' > "$RUNNER_TEMP/nodeps.json"
          usage 1 install-manifest "$RUNNER_TEMP/nodeps.json" --dir "$RUNNER_TEMP/u"
