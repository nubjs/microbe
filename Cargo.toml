# microbe — the smallest embeddable npm package installer. A library (plus a thin
# `microbe` binary) that fetches ONE package and its dependency tree from the registry into
# a directory the caller names, verifies integrity, and reports the bin entries. Nothing
# else: no lockfile, no node_modules reconciliation, no lifecycle scripts, no store.
#
# Size budget: under 1 MB stripped, and CI fails if a default build reaches it. Measured
# 2026-09-19 (opt-level "z" + fat LTO): 853 KB on darwin-arm64 and 784 KB on win32-x64,
# both with the platform TLS always linked; 682 KB on linux-x64 with no TLS at all, because
# rustls would cost about 1.1 MB there. Hence on Linux in-binary TLS is opt-in
# (`--features tls`) and the default build reaches the network through a client the host
# already has — see src/transport.rs.
[package]
name = "microbe"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
description = "The smallest embeddable npm package installer: one package and its dependency tree, into a directory."

[features]
default = []
# In-binary TLS on Linux, through rustls, where it costs about 1 MB and so is opt-in. On
# macOS and Windows the platform TLS (Security.framework / SChannel) is always linked — about
# 300 KB, no C compiled, no process spawned — and this feature changes nothing.
tls = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust inflate; the C zlib backend would need a toolchain and buys nothing at this size.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
sha2 = "0.10"
# Legacy `dist.shasum` for packages published before `integrity` existed.
sha1 = "0.10"
base64 = "0.22"
# Same crate vendor/aube resolves with, so range semantics match nub's own installer.
node-semver = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# The client is built with `RootCerts::PlatformVerifier`: ureq's default hands the platform
# ONLY Mozilla's bundle, which SChannel refuses for a chain ending elsewhere (ureq #1155).
# `native-tls-no-default` would drop that bundle from the binary, but in ureq 3.4.2 every
# connector gate checks `feature = "native-tls"`, so it compiles no TLS at all.
ureq = { version = "3", default-features = false, features = ["gzip", "native-tls"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
ureq = { version = "3", default-features = false, features = ["gzip", "rustls"], optional = true }

[[bin]]
name = "microbe"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
